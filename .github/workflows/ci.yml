# Quality gate for every push and pull request.
# Phase 10 extends it with Playwright E2E and the deploy workflow.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Format, lint, type-check, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: convites
          POSTGRES_PASSWORD: convites
          POSTGRES_DB: convites_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U convites -d convites_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      NEXT_TELEMETRY_DISABLED: 1
      # Only the integration tests and the migration checks use this throwaway database.
      DATABASE_URL: postgresql://convites:convites@localhost:5432/convites_test
      TEST_DATABASE_URL: postgresql://convites:convites@localhost:5432/convites_test
      # Integration tests: cache, rate limiter and view tracking against a real Redis.
      TEST_REDIS_URL: redis://localhost:6379/15
      # Upload tests: MinIO started below (the tests create their own bucket).
      TEST_S3_ENDPOINT: http://localhost:9000

    steps:
      # Actions are pinned to commit SHAs (supply-chain safety); Dependabot keeps them current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # `postinstall` also generates the Prisma client.
      - run: npm ci

      - run: npx prisma validate

      - run: npm run format:check

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

      - name: Apply every migration to an empty database
        run: npx prisma migrate deploy

      - name: Fail if the schema changed without a migration
        run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code

      # A service container cannot take MinIO's `server /data` command, so it is started here.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=convites -e MINIO_ROOT_PASSWORD=convites-dev-secret \
            cgr.dev/chainguard/minio:latest server /data
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:9000/minio/health/live > /dev/null; then exit 0; fi
            sleep 2
          done
          docker logs minio
          exit 1

      - run: npm run test:integration

      - name: Restore Next.js build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('app/**', 'src/**', '*.ts') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      # No runtime secrets needed: the environment is validated when the server starts, not at build.
      - run: npm run build
